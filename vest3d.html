<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEAD LETTERS — 3D VEST BUILDER</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #0a0a0a;
  overflow: hidden;
  font-family: 'Courier New', monospace;
}
#c { display: block; width: 100vw; height: 100vh; }

#hud {
  position: fixed; top: 24px; left: 0; right: 0;
  display: flex; justify-content: center;
  pointer-events: none; z-index: 10;
}
#hud > div {
  text-align: center;
  background: rgba(0,0,0,0.65);
  border: 1px solid rgba(200,184,154,0.25);
  padding: 12px 28px;
  letter-spacing: 0.18em;
}
.brand { color: #c8b89a; font-size: 1.4rem; font-weight: bold; text-shadow: 0 0 18px rgba(200,184,154,0.4); }
.sub { color: rgba(200,184,154,0.55); font-size: 0.65rem; margin-top: 4px; letter-spacing: 0.12em; }

#label {
  position: fixed; bottom: 100px; left: 0; right: 0;
  text-align: center; color: rgba(200,184,154,0.3);
  font-size: 0.6rem; letter-spacing: 0.15em;
  pointer-events: none; z-index: 10;
}

#ctrl {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%);
  display: flex; align-items: center; gap: 4px;
  background: rgba(0,0,0,0.7);
  border: 1px solid rgba(200,184,154,0.2);
  padding: 10px 14px; z-index: 10;
  flex-wrap: wrap; justify-content: center; max-width: 95vw;
}
.btn {
  background: rgba(200,184,154,0.08);
  border: 1px solid rgba(200,184,154,0.3);
  color: rgba(200,184,154,0.8);
  padding: 5px 10px; font-size: 0.6rem;
  cursor: pointer; letter-spacing: 0.08em;
  font-family: 'Courier New', monospace;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  white-space: nowrap;
}
.btn:hover { background: rgba(200,184,154,0.18); }
.btn.active {
  background: rgba(200,184,154,0.22);
  border-color: rgba(200,184,154,0.7);
  color: #c8b89a;
}
.btn-color {
  width: 24px; height: 24px; padding: 0;
  border-radius: 50%; cursor: pointer;
  border: 2px solid rgba(200,184,154,0.4);
  transition: transform 0.15s, border-color 0.15s;
}
.btn-color:hover { transform: scale(1.15); }
.btn-color.active { border-color: #c8b89a; box-shadow: 0 0 8px rgba(200,184,154,0.5); }
#swatches { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.sep { width: 1px; height: 20px; background: rgba(200,184,154,0.2); margin: 0 3px; }
.section-label {
  color: rgba(200,184,154,0.5); font-size: 0.5rem;
  letter-spacing: 0.15em; text-transform: uppercase;
  margin: 0 4px; align-self: center;
}

#price-display {
  position: fixed; top: 80px; right: 24px;
  background: rgba(0,0,0,0.7);
  border: 1px solid rgba(200,184,154,0.2);
  padding: 8px 16px; z-index: 10;
  text-align: right; font-size: 0.7rem;
}
#price-display .label { color: rgba(200,184,154,0.5); letter-spacing: 0.12em; }
#price-display .amount { color: #c8b89a; font-size: 1rem; font-weight: bold; }
#price-display .currency { color: rgba(200,184,154,0.5); font-size: 0.6rem; }

#error-msg {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  color: #c8b89a; font-size: 0.8rem; text-align: center;
  z-index: 20; display: none;
  background: rgba(0,0,0,0.8);
  border: 1px solid rgba(200,184,154,0.3);
  padding: 20px 30px;
}
#error-msg .detail { margin-top: 8px; font-size: 0.6rem; color: rgba(200,184,154,0.5); }

#ctrl-scroll {
  overflow-x: auto; max-width: 95vw;
  scrollbar-width: thin;
  scrollbar-color: rgba(200,184,154,0.2) transparent;
}
#ctrl-scroll::-webkit-scrollbar { height: 4px; }
#ctrl-scroll::-webkit-scrollbar-thumb { background: rgba(200,184,154,0.2); }

#option-img-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background-size: contain; background-position: center;
  background-repeat: no-repeat;
  pointer-events: none; z-index: 5;
  opacity: 0;
  transition: opacity 0.3s ease;
}
#option-img-overlay.visible { opacity: 0.15; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.145.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<canvas id="c"></canvas>
<div id="option-img-overlay"></div>

<div id="hud">
  <div>
    <div class="brand">DEAD LETTERS</div>
    <div class="sub">VEST BUILDER — 3D PREVIEW</div>
  </div>
</div>

<div id="label">DRAG TO ROTATE &nbsp;·&nbsp; SCROLL TO ZOOM</div>

<div id="price-display">
  <div class="label">ESTIMATED PRICE</div>
  <div class="amount" id="priceAmount">$825</div>
  <div class="currency">AUD</div>
</div>

<div id="ctrl-scroll">
<div id="ctrl">
  <span class="section-label">GENDER</span>
  <button class="btn active" data-group="gender" data-value="male">Male</button>
  <button class="btn" data-group="gender" data-value="female">Female</button>
  <div class="sep"></div>

  <span class="section-label">STYLE</span>
  <button class="btn active" data-group="style" data-value="australian">Australian</button>
  <button class="btn" data-group="style" data-value="nz">NZ</button>
  <button class="btn" data-group="style" data-value="american">American</button>
  <button class="btn" data-group="style" data-value="euro">Euro</button>
  <button class="btn" data-group="style" data-value="tactical">Tactical</button>
  <button class="btn" data-group="style" data-value="swat">SWAT</button>
  <div class="sep"></div>

  <span class="section-label">LEATHER</span>
  <div id="swatches">
    <div class="btn-color active" data-group="leather" data-value="black" style="background:#1a1a1a;" title="Black"></div>
    <div class="btn-color" data-group="leather" data-value="white" style="background:#f0f0f0;border-color:#999;" title="White"></div>
    <div class="btn-color" data-group="leather" data-value="blue" style="background:#1a3a6e;" title="Blue"></div>
    <div class="btn-color" data-group="leather" data-value="red" style="background:#8b0000;" title="Red"></div>
    <div class="btn-color" data-group="leather" data-value="green" style="background:#2d4a1e;" title="Green"></div>
    <div class="btn-color" data-group="leather" data-value="orange" style="background:#b35000;" title="Orange"></div>
    <div class="btn-color" data-group="leather" data-value="desertbrown" style="background:#8b5a2b;" title="Desert Brown Perf."></div>
    <div class="btn-color" data-group="leather" data-value="stormgrey" style="background:#4a4a4a;" title="Storm Grey Camo"></div>
    <div class="btn-color" data-group="leather" data-value="blackops" style="background:#0d0d0d;border-color:#555;" title="Black Ops Perf."></div>
    <div class="btn-color" data-group="leather" data-value="blackperf" style="background:#2a2a2a;" title="Black Perforated"></div>
    <div class="btn-color" data-group="leather" data-value="multical" style="background:#5c5c3c;" title="Multi Cam"></div>
  </div>
  <div class="sep"></div>

  <span class="section-label">CUT</span>
  <button class="btn active" data-group="cut" data-value="tom">TOM (Short/Braid)</button>
  <button class="btn" data-group="cut" data-value="classic">Classic</button>
  <button class="btn" data-group="cut" data-value="competition">Competition</button>
  <button class="btn" data-group="cut" data-value="long">Long</button>
  <div class="sep"></div>

  <span class="section-label">CLOSURE</span>
  <button class="btn active" data-group="closure" data-value="bolo">Bolo + Braided Sides</button>
  <button class="btn" data-group="closure" data-value="zipper">Centre Zipper</button>
  <button class="btn" data-group="closure" data-value="buttonsnaps">Button + Snaps</button>
  <button class="btn" data-group="closure" data-value="buckles">Utility Buckles</button>
  <button class="btn" data-group="closure" data-value="velcro">Velcro Front</button>
  <button class="btn" data-group="closure" data-value="snap">Snaps</button>
  <div class="sep"></div>

  <span class="section-label">COLLAR</span>
  <button class="btn active" data-group="collar" data-value="widev">Wide V</button>
  <button class="btn" data-group="collar" data-value="v">V-Neck</button>
  <button class="btn" data-group="collar" data-value="stand">Stand-Up</button>
  <button class="btn" data-group="collar" data-value="notch">Notch</button>
  <button class="btn" data-group="collar" data-value="none">None</button>
  <div class="sep"></div>

  <span class="section-label">BRAID</span>
  <button class="btn active" data-group="braid" data-value="none">None</button>
  <button class="btn" data-group="braid" data-value="single">Single</button>
  <button class="btn" data-group="braid" data-value="double">Double</button>
  <div class="sep"></div>

  <span class="section-label">STITCH</span>
  <div id="swatches">
    <div class="btn-color active" data-group="stitch" data-value="matching" style="background:#1a1a1a;border-color:#c8b89a;" title="Matching"></div>
    <div class="btn-color" data-group="stitch" data-value="white" style="background:#f0f0f0;" title="White"></div>
    <div class="btn-color" data-group="stitch" data-value="black" style="background:#1a1a1a;" title="Black"></div>
    <div class="btn-color" data-group="stitch" data-value="blue" style="background:#1a3a6e;" title="Blue"></div>
    <div class="btn-color" data-group="stitch" data-value="red" style="background:#8b0000;" title="Red"></div>
    <div class="btn-color" data-group="stitch" data-value="green" style="background:#2d4a1e;" title="Green"></div>
    <div class="btn-color" data-group="stitch" data-value="orange" style="background:#b35000;" title="Orange"></div>
    <div class="btn-color" data-group="stitch" data-value="grey" style="background:#888;" title="Grey"></div>
  </div>
  <div class="sep"></div>

  <span class="section-label">LINER</span>
  <button class="btn active" data-group="liner" data-value="standard">Standard Mesh</button>
  <button class="btn" data-group="liner" data-value="black">Black</button>
  <button class="btn" data-group="liner" data-value="matchstitch">Match Bandana/Stitch</button>
  <button class="btn" data-group="liner" data-value="custom">Custom/Other</button>
  <div class="sep"></div>

  <span class="section-label">KEVLAR</span>
  <button class="btn active" data-group="kevlar" data-value="none">None</button>
  <button class="btn" data-group="kevlar" data-value="1layer">1 Layer</button>
  <button class="btn" data-group="kevlar" data-value="2layers">2 Layers</button>
  <button class="btn" data-group="kevlar" data-value="3layers">3 Layers</button>
  <button class="btn" data-group="kevlar" data-value="4layers">4 Layers</button>
  <button class="btn" data-group="kevlar" data-value="5layers">5 Layers</button>
  <button class="btn" data-group="kevlar" data-value="6layers">6 Layers</button>
  <button class="btn" data-group="kevlar" data-value="7layers">7 Layers</button>
  <button class="btn" data-group="kevlar" data-value="8layers">8 Layers</button>
  <button class="btn" data-group="kevlar" data-value="9layers">9 Layers</button>
  <button class="btn" data-group="kevlar" data-value="10layers">10 Layers</button>
  <div class="sep"></div>

  <span class="section-label">PIPING</span>
  <button class="btn active" data-group="piping" data-value="standard">Standard</button>
  <button class="btn" data-group="piping" data-value="white">White</button>
  <button class="btn" data-group="piping" data-value="red">Red</button>
  <button class="btn" data-group="piping" data-value="blue">Blue</button>
  <button class="btn" data-group="piping" data-value="gold">Metallic Gold</button>
  <button class="btn" data-group="piping" data-value="yellow">Warm Yellow</button>
  <button class="btn" data-group="piping" data-value="lemon">Lemon Yellow</button>
  <button class="btn" data-group="piping" data-value="maroon">Maroon</button>
  <button class="btn" data-group="piping" data-value="grey">Grey</button>
  <button class="btn" data-group="piping" data-value="black">Black</button>
  <div class="sep"></div>

  <span class="section-label">REVERSIBLE</span>
  <button class="btn active" data-group="reversible" data-value="no">No</button>
  <button class="btn" data-group="reversible" data-value="yes">Yes (+$75)</button>
  <div class="sep"></div>

  <span class="section-label">ZIPPER ACCESS</span>
  <button class="btn active" data-group="zipperAccess" data-value="no">No</button>
  <button class="btn" data-group="zipperAccess" data-value="yes">Yes (+$50)</button>
  <div class="sep"></div>

  <span class="section-label">BACK PATCH</span>
  <button class="btn active" data-group="patch" data-value="none">None</button>
  <button class="btn" data-group="patch" data-value="eagle">Eagle (+$55)</button>
  <button class="btn" data-group="patch" data-value="cross">Skull & Cross (+$55)</button>
  <button class="btn" data-group="patch" data-value="custom">Custom Text (+$75)</button>
  <div class="sep"></div>

  <span class="section-label">ADD-ONS</span>
  <button class="btn" data-group="addons" data-value="extrapocket">Extra Pocket (+$15)</button>
  <button class="btn" data-group="addons" data-value="hiddenstash">Hidden Stash (+$15)</button>
  <button class="btn" data-group="addons" data-value="gunpocket">Gun Pocket (+$30)</button>
  <button class="btn" data-group="addons" data-value="zipext">Zipper Extension (+$100)</button>
  <button class="btn" data-group="addons" data-value="heatedliner">Heated Liner (+$175)</button>
  <button class="btn" data-group="addons" data-value="customprint">Custom Print (+$100)</button>
  <button class="btn" data-group="addons" data-value="fullzipliner">Full Zip Liner (+$75)</button>
  <button class="btn" data-group="addons" data-value="customfit">Custom Fit (+$150)</button>
  <button class="btn" data-group="addons" data-value="dutchback">Dutch Curved Back</button>
  <button class="btn" data-group="addons" data-value="fatstrap">Zip In Fatstrap</button>
</div>
</div>

<div id="error-msg">
  <div>WebGL failed to initialize</div>
  <div class="detail" id="error-detail"></div>
</div>

<script>
window.addEventListener('error', function(e) {
  var el = document.getElementById('error-msg');
  var detail = document.getElementById('error-detail');
  if (el) { el.style.display = 'block'; }
  if (detail && e.error) { detail.textContent = e.error.message || String(e.error); }
});
window.addEventListener('unhandledrejection', function(e) {
  var el = document.getElementById('error-msg');
  var detail = document.getElementById('error-detail');
  if (el) { el.style.display = 'block'; }
  if (detail) { detail.textContent = 'Promise rejection: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)); }
});
</script>

<script type="module" src="vest3d.js"></script>

</body>
</html>
