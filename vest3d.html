<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEAD LETTERS — 3D VEST BUILDER</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #0a0a0a;
  overflow: hidden;
  font-family: 'Courier New', monospace;
}
#c { display: block; width: 100vw; height: 100vh; }
#hud {
  position: fixed; top: 24px; left: 0; right: 0;
  display: flex; justify-content: center;
  pointer-events: none; z-index: 10;
}
#hud > div {
  text-align: center;
  background: rgba(0,0,0,0.65);
  border: 1px solid rgba(200,184,154,0.25);
  padding: 12px 28px;
  letter-spacing: 0.18em;
}
.brand {
  color: #c8b89a; font-size: 1.4rem; font-weight: bold;
  text-shadow: 0 0 18px rgba(200,184,154,0.4);
}
.sub { color: rgba(200,184,154,0.55); font-size: 0.65rem; margin-top: 4px; letter-spacing: 0.12em; }
#label {
  position: fixed; bottom: 100px; left: 0; right: 0;
  text-align: center; color: rgba(200,184,154,0.3);
  font-size: 0.6rem; letter-spacing: 0.15em;
  pointer-events: none; z-index: 10;
}
#ctrl {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%);
  display: flex; align-items: center; gap: 6px;
  background: rgba(0,0,0,0.7);
  border: 1px solid rgba(200,184,154,0.2);
  padding: 10px 16px; z-index: 10;
  flex-wrap: wrap; justify-content: center; max-width: 95vw;
}
.btn {
  background: rgba(200,184,154,0.08);
  border: 1px solid rgba(200,184,154,0.3);
  color: rgba(200,184,154,0.8);
  padding: 5px 11px; font-size: 0.6rem;
  cursor: pointer; letter-spacing: 0.08em;
  font-family: 'Courier New', monospace;
  transition: background 0.15s;
}
.btn:hover { background: rgba(200,184,154,0.18); }
.btn.active {
  background: rgba(200,184,154,0.22);
  border-color: rgba(200,184,154,0.7);
  color: #c8b89a;
}
.btn-color { width: 26px; height: 26px; padding: 0; border-radius: 50%; cursor: pointer; }
#swatches { display: flex; gap: 6px; align-items: center; }
#error-msg {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  color: #c8b89a; font-size: 0.8rem; text-align: center;
  z-index: 20; display: none;
}
</style>

<!-- Import map for bare specifiers -->
<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/controls/OrbitControls.min.js"></script>
</head>
<body>

<canvas id="c"></canvas>

<div id="hud">
  <div>
    <div class="brand">DEAD LETTERS</div>
    <div class="sub">VEST BUILDER — 3D PREVIEW</div>
  </div>
</div>

<div id="label">DRAG TO ROTATE &nbsp;·&nbsp; SCROLL TO ZOOM</div>

<div id="ctrl">
  <div id="swatches">
    <div id="s-black"  class="btn btn-color active" style="background:#1a1a1a;" title="Black"></div>
    <div id="s-brown"  class="btn btn-color"         style="background:#3d1a0a;" title="Brown"></div>
    <div id="s-oxblood" class="btn btn-color"        style="background:#4a0f0f;" title="Oxblood"></div>
    <div id="s-tan"    class="btn btn-color"         style="background:#8c5a2e;" title="Tan"></div>
  </div>
  <div style="width:1px;height:20px;background:rgba(200,184,154,0.2);"></div>
  <button class="btn active" data-cut="classic">Classic</button>
  <button class="btn" data-cut="racer">Racer</button>
  <button class="btn" data-cut="field">Field</button>
  <div style="width:1px;height:20px;background:rgba(200,184,154,0.2);"></div>
  <button class="btn active" data-closure="zip">Zip</button>
  <button class="btn" data-closure="button">Button</button>
  <button class="btn" data-closure="snap">Snap</button>
  <div style="width:1px;height:20px;background:rgba(200,184,154,0.2);"></div>
  <button class="btn active" data-collar="notch">Notch</button>
  <button class="btn" data-collar="shawl">Shawl</button>
  <button class="btn" data-collar="flat">Flat</button>
  <div style="width:1px;height:20px;background:rgba(200,184,154,0.2);"></div>
  <button class="btn active" data-braid="single">Single</button>
  <button class="btn" data-braid="double">Double</button>
  <button class="btn" data-braid="none">None</button>
</div>

<div id="error-msg">
  <div>WebGL failed to initialize</div>
  <div id="error-detail" style="margin-top:8px;font-size:0.6rem;color:rgba(200,184,154,0.5);"></div>
</div>

<script>
window.addEventListener('error', function(e) {
  var el = document.getElementById('error-msg');
  var detail = document.getElementById('error-detail');
  if (el) { el.style.display = 'block'; }
  if (detail && e.error) { detail.textContent = e.error.message || String(e.error); }
});
window.addEventListener('unhandledrejection', function(e) {
  var el = document.getElementById('error-msg');
  var detail = document.getElementById('error-detail');
  if (el) { el.style.display = 'block'; }
  if (detail) { detail.textContent = 'Promise rejection: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)); }
});
</script>

<script>
// THREE and THREE.OrbitControls are globals from the CDN scripts above.

// ── State ──────────────────────────────────────────────────
const state = {
  leather: 'black', cut: 'classic', closure: 'zip',
  collar: 'notch', braid: 'single', color: 0x1a1a1a,
};
const COLORS = { black:0x1a1a1a, brown:0x3d1a0a, oxblood:0x4a0f0f, tan:0x8c5a2e };
const METAL  = { zip:0xc9a84c, button:0x888888, snap:0xaaaaaa };

// ── Materials ─────────────────────────────────────────────
let bodyMat, collarMat, closureMat;
function mkMat(hex) {
  return new THREE.MeshStandardMaterial({ color: hex, roughness: 0.85, metalness: 0.05, side: THREE.DoubleSide });
}
function mkMetal(hex) {
  return new THREE.MeshStandardMaterial({ color: hex, roughness: 0.2, metalness: 0.95 });
}

// ── Helpers ───────────────────────────────────────────────
function dispose(group) {
  group.traverse(o => { if (o.geometry) o.geometry.dispose(); });
}

// ── Torso ────────────────────────────────────────────────
function buildTorso() {
  const g = new THREE.Group();
  const shape = new THREE.Shape();
  const w = 1.2, h = 1.7, armW = 0.38, armH = 0.72;

  if (state.cut === 'classic') {
    shape.moveTo(-w/2, 0);
    shape.lineTo(-w/2, h - armH);
    shape.bezierCurveTo(-w/2+armW, h-armH, -w/2+armW+0.1, h-armH+0.08, -w/2+armW+0.18, h);
    shape.lineTo(-0.12, 0);
    shape.lineTo(0.12, 0);
    shape.lineTo(w/2-armW-0.18, h);
    shape.bezierCurveTo(w/2-armW-0.1, h-armH+0.08, w/2-armW, h-armH, w/2, 0);
  } else if (state.cut === 'racer') {
    shape.moveTo(-w/2, 0);
    shape.lineTo(-w/2+0.08, h-0.05);
    shape.bezierCurveTo(-0.3, h+0.05, 0.3, h+0.05, w/2-0.08, h-0.05);
    shape.lineTo(w/2, 0);
    shape.lineTo(0.12, 0);
    shape.lineTo(-0.12, 0);
  } else {
    shape.moveTo(-w/2, 0);
    shape.lineTo(-w/2, h - armH + 0.15);
    shape.bezierCurveTo(-w/2+0.1, h-armH+0.15, -w/2+0.15, h-armH+0.1, -w/2+0.2, h-armH+0.22);
    shape.lineTo(-0.12, 0);
    shape.lineTo(0.12, 0);
    shape.lineTo(w/2-0.2, h-armH+0.22);
    shape.bezierCurveTo(w/2-0.15, h-armH+0.1, w/2-0.1, h-armH+0.15, w/2, 0);
  }

  const extSettings = {
    steps: 1, depth: 0.12,
    bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.01, bevelSegments: 3,
  };
  const geo = new THREE.ExtrudeGeometry(shape, extSettings);
  geo.center();
  const m = new THREE.Mesh(geo, bodyMat);
  m.castShadow = true; m.receiveShadow = true;
  g.add(m);
  return g;
}

// ── Collar ───────────────────────────────────────────────
function buildCollar() {
  const g = new THREE.Group();
  const collarColor = new THREE.Color(state.color).multiplyScalar(0.75);
  const cMat = new THREE.MeshStandardMaterial({ color: collarColor, roughness: 0.8, metalness: 0.05 });
  const w = 1.22;

  if (state.collar === 'notch') {
    const notch = 0.22;
    const shape = new THREE.Shape();
    shape.moveTo(-w/2, 0); shape.lineTo(-w/2, 0.12);
    shape.lineTo(-notch, 0.12); shape.lineTo(-notch*0.4, 0.0);
    shape.lineTo(0, -0.06); shape.lineTo(notch*0.4, 0.0);
    shape.lineTo(notch, 0.12); shape.lineTo(w/2, 0.12); shape.lineTo(w/2, 0);
    const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.06, bevelEnabled: false });
    const m = new THREE.Mesh(geo, cMat);
    m.position.set(0, 0.85, 0.03); m.castShadow = true;
    g.add(m);
  } else if (state.collar === 'shawl') {
    const curve = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(-w/2, 0.75, 0),
      new THREE.Vector3(0, 0.68, 0.1),
      new THREE.Vector3(w/2, 0.75, 0)
    );
    const geo = new THREE.TubeGeometry(curve, 20, 0.05, 8, false);
    const m = new THREE.Mesh(geo, cMat);
    m.castShadow = true; g.add(m);
  } else {
    const geo = new THREE.BoxGeometry(w, 0.08, 0.08);
    const m = new THREE.Mesh(geo, cMat);
    m.position.set(0, 0.85, 0.02); m.castShadow = true;
    g.add(m);
  }
  return g;
}

// ── Closure ───────────────────────────────────────────────
function buildClosure() {
  const g = new THREE.Group();
  const cMat = mkMetal(METAL[state.closure] ?? 0xc9a84c);

  if (state.closure === 'zip') {
    const tabGeo = new THREE.BoxGeometry(0.06, 0.12, 0.04);
    [-0.55, -0.3, -0.05, 0.2, 0.45].forEach(y => {
      const tab = new THREE.Mesh(tabGeo, cMat);
      tab.position.set(0, y, 0.1); g.add(tab);
    });
    const trackGeo = new THREE.BoxGeometry(0.03, 1.2, 0.03);
    const track = new THREE.Mesh(trackGeo, mkMetal(0x888888));
    track.position.set(0, 0, 0.09); g.add(track);
  } else if (state.closure === 'button') {
    const btnGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.025, 16);
    for (let y = -0.5; y <= 0.5; y += 0.22) {
      [-0.12, 0.12].forEach(x => {
        const b = new THREE.Mesh(btnGeo, cMat);
        b.rotation.x = Math.PI / 2; b.position.set(x, y, 0.1); g.add(b);
      });
    }
  } else {
    const snapGeo = new THREE.SphereGeometry(0.03, 8, 8);
    for (let y = -0.5; y <= 0.5; y += 0.22) {
      [-0.12, 0.12].forEach(x => {
        const s = new THREE.Mesh(snapGeo, cMat);
        s.position.set(x, y, 0.1); g.add(s);
      });
    }
  }
  return g;
}

// ── Braid ────────────────────────────────────────────────
function rope(points) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
  const geo = new THREE.TubeGeometry(curve, 20, 0.012, 6, false);
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x8a6a3a, roughness: 0.7, metalness: 0.1 }));
  m.castShadow = true; return m;
}

function buildBraids() {
  const g = new THREE.Group();
  if (state.braid === 'none') return g;
  const xOff = state.closure === 'zip' ? 0.18 : 0.22;
  const z = 0.085;

  if (state.braid === 'single') {
    g.add(rope([[-xOff, 0.55, z], [-xOff*0.6, 0.3, z], [0, 0.0, z], [xOff*0.6, -0.3, z], [xOff, -0.55, z]]));
  } else {
    g.add(rope([[-xOff, 0.55, z], [-xOff*0.6, 0.3, z], [-xOff*0.3, 0.0, z], [0, -0.3, z], [xOff*0.3, -0.55, z]]));
    g.add(rope([[xOff, 0.55, z], [xOff*0.6, 0.3, z], [xOff*0.3, 0.0, z], [0, -0.3, z], [-xOff*0.3, -0.55, z]]));
  }
  g.add(rope([[-0.12,-0.35,z],[0,-0.38,z],[0.12,-0.35,z]]));
  g.add(rope([[-0.12,-0.41,z],[0,-0.44,z],[0.12,-0.41,z]]));
  g.add(rope([[-0.56,-0.1,z],[-0.59,-0.26,z]]));
  g.add(rope([[0.56,-0.1,z],[0.59,-0.26,z]]));
  return g;
}

// ── Shoulder patches ──────────────────────────────────────
function buildShoulderPatches() {
  const g = new THREE.Group();
  const geo = new THREE.BoxGeometry(0.22, 0.06, 0.04);
  const patchColor = new THREE.Color(state.color).multiplyScalar(0.6);
  const pMat = new THREE.MeshStandardMaterial({ color: patchColor, roughness: 0.9, metalness: 0.0 });
  [[-0.98, 0.55],[0.98, 0.55]].forEach(([x, y]) => {
    const m = new THREE.Mesh(geo, pMat);
    m.position.set(x, y, 0.08); m.rotation.z = x > 0 ? 0.15 : -0.15;
    m.castShadow = true; g.add(m);
  });
  return g;
}

// ── Assemble ─────────────────────────────────────────────
function buildVest() {
  const g = new THREE.Group();
  g.add(buildTorso(), buildCollar(), buildClosure(), buildBraids(), buildShoulderPatches());
  return g;
}

// ── Renderer & scene ──────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);
scene.fog = new THREE.FogExp2(0x0a0a0a, 0.3);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.01, 50);
camera.position.set(0, 0.1, 4.8);

const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 2.5;
controls.maxDistance = 9;
controls.target.set(0, 0.1, 0);
controls.update();

const ambient = new THREE.AmbientLight(0x3a2a1a, 3.5);
scene.add(ambient);
const key = new THREE.DirectionalLight(0xfff5e8, 2.8);
key.position.set(2, 4, 4); key.castShadow = true;
key.shadow.mapSize.width = 2048; key.shadow.mapSize.height = 2048;
key.shadow.camera.near = 0.5; key.shadow.camera.far = 20;
key.shadow.camera.left = -3; key.shadow.camera.right = 3;
key.shadow.camera.top = 3; key.shadow.camera.bottom = -3;
scene.add(key);
const fill1 = new THREE.DirectionalLight(0xc8d8ff, 0.6);
fill1.position.set(-3, 1, 2); scene.add(fill1);
const fill2 = new THREE.DirectionalLight(0xffd580, 0.4);
fill2.position.set(0, -2, -3); scene.add(fill2);

const groundGeo = new THREE.PlaneGeometry(20, 20);
const groundMat = new THREE.ShadowMaterial({ opacity: 0.25 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2; ground.position.y = -1.0; ground.receiveShadow = true;
scene.add(ground);

refreshMaterials();
let vestGroup = buildVest();
scene.add(vestGroup);

function refreshMaterials() {
  const c = state.color;
  bodyMat    = mkMat(c);
  collarMat  = mkMat(new THREE.Color(c).multiplyScalar(0.75));
  closureMat = mkMetal(METAL[state.closure] ?? 0xc9a84c);
}

function updateVest() {
  dispose(vestGroup); scene.remove(vestGroup);
  refreshMaterials();
  vestGroup = buildVest(); scene.add(vestGroup);
}

// ── UI ────────────────────────────────────────────────────
document.querySelectorAll('.btn-color').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.btn-color').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const id = btn.id.replace('s-', '');
    state.leather = id; state.color = COLORS[id];
    updateVest();
  });
});

['cut', 'closure', 'collar', 'braid'].forEach(type => {
  document.querySelectorAll(`[data-${type}]`).forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll(`[data-${type}]`).forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state[type] = btn.dataset[type];
      if (type === 'closure') {
        vestGroup.traverse(o => {
          if (o.isMesh && o.material && o.material.metalness > 0.5) {
            o.material = mkMetal(METAL[state.closure] ?? 0xc9a84c);
          }
        });
      } else { updateVest(); }
    });
  });
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
animate();
</script>
</body>
</html>
